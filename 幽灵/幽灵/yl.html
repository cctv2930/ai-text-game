<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25小时幻想空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body {
            background-image: url("背景图.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.2);
            z-index: 0;
            pointer-events: none;
        }
        .browser-header {
            height: 50px;
            background: #ffffff;
            border-bottom: 1px solid #EAEAEA;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }
        .window-controls {
            display: flex;
            gap: 8px;
        }
        .control-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .btn-red { background-color: #ff5f57; }
        .btn-yellow { background-color: #ffbd2e; }
        .btn-green { background-color: #28c840; }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .nav-text {
            font-size: 12px;
            color: #666;
        }
        .search-bar {
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            height: 30px;
            background: #F5F5F5;
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }
        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 12px;
            color: #999;
        }
        .nav-right {
            display: flex;
            gap: 20px;
        }
        .nav-icon {
            width: 16px;
            height: 16px;
            opacity: 0.4;
        }
        .main-content {
            position: relative;
            width: 100%;
            height: calc(100vh - 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .bg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22vw;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 20px;
            z-index: 1;
            text-shadow: 
                0 0 10px #fff,
                0 0 30px #00aaff,
                0 0 50px #0088ff,
                0 0 70px #0066ff,
                0 0 90px #0044ff;
            animation: glowStrong 3s infinite alternate;
        }

        @keyframes glowStrong {
            0% {
                text-shadow: 
                    0 0 10px #fff,
                    0 0 30px #00aaff,
                    0 0 50px #0088ff;
            }
            100% {
                text-shadow: 
                    0 0 20px #fff,
                    0 0 40px #00aaff,
                    0 0 60px #0088ff,
                    0 0 80px #0066ff,
                    0 0 100px #0044ff;
            }
        }

        /* ✅ 关键：幽灵容器（相对定位，用来装对话框） */
        .ghost-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .ghost {
            width: 400px;
            height: auto;
            cursor: pointer;
            transition: all 1s ease;
            filter: drop-shadow(0 0 25px rgba(232, 193, 122, 0.8));
            animation: ghostFloat 3s ease-in-out infinite;
            display: block;
        }
        @keyframes ghostFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .ghost:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 0 40px rgba(232, 193, 122, 1));
        }

        /* ✅ 对话框：相对于幽灵容器定位，永远在头顶 */
        .chat-bubble {
            position: absolute;
            top: -10px; /* 距离幽灵顶部100px，可微调 */
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(255, 255, 255, 0.92);
            padding: 18px 30px;
            border-radius: 30px;
            font-size: 20px;
            color: #3b2f75;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(124, 106, 255, 0.4);
            opacity: 0;
            animation: bubblePop 1s ease forwards;
        }

        /* 小三角指向幽灵 */
        .chat-bubble::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 12px solid rgba(255, 255, 255, 0.92);
        }

        @keyframes bubblePop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .footer-text {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #fff;
            text-align: center;
            letter-spacing: 1.5px;
            z-index: 3;
            text-shadow: 0 1px 10px rgba(0,0,0,0.5);
        }
        .footer-text::after {
            content: "";
            display: block;
            width: 50px;
            height: 2px;
            background: #E8C17A;
            margin: 12px auto 0;
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            color: #fff;
            opacity: 0.7;
            cursor: pointer;
            z-index: 3;
            transition: 0.3s;
        }
        .arrow:hover {
            opacity: 1;
            color: #E8C17A;
        }
        .arrow-left { left: 30px; }
        .arrow-right { right: 30px; }
    </style>
</head>
<body>
    <div class="browser-header">
        <div class="nav-left">
            <div class="window-controls">
                <div class="control-btn btn-red"></div>
                <div class="control-btn btn-yellow"></div>
                <div class="control-btn btn-green"></div>
            </div>
            <span class="nav-text">首页</span>
            <span class="nav-text">25HOUR</span>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="https://25hour-space.com">
        </div>
        <div class="nav-right">
            <div class="nav-icon">🔍</div>
            <div class="nav-icon">⚙️</div>
            <div class="nav-icon">📂</div>
            <div class="nav-icon">🗖</div>
        </div>
    </div>

    <div class="main-content">
        <div class="bg-text">DZXQH</div>

        <!-- ✅ 核心：幽灵和对话框放在同一个容器里 -->
        <div class="ghost-container">
            <img src="小怪物.png" alt="幽灵" class="ghost" id="ghost">
            <div class="chat-bubble" id="bubble">欢迎来到25小时幻想空间！</div>
        </div>

        <div class="arrow arrow-left">◀</div>
        <div class="arrow arrow-right">▶</div>
    </div>

    <script>
        const ghost = document.getElementById('ghost');
        const bubble = document.getElementById('bubble');

        // 点击幽灵跳转到下一页
        ghost.addEventListener('click', function() {
            window.location.href = "yler.html";
        });

        // 进入页面3秒后弹出对话框
        setTimeout(() => {
            bubble.style.opacity = 1;
        }, 2000);
    </script>
</body>
</html>

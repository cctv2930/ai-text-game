<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成中... | 25小时幻想空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #3b2f75 0%, #6c53a8 100%);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .ghost {
            width: 180px;
            margin-bottom: 30px;
            animation: float 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255,230,180,0.8));
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        .loading-title {
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #8f88ff, 0 0 30px #6c53a8;
        }

        .prompt-text {
            color: #ddd;
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .progress-container {
            position: relative;
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
            overflow: visible;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c6aff, #a89bff);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .mini-ghost {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            animation: bounce 1.2s infinite alternate;
            pointer-events: none;
        }

        @keyframes bounce {
            0% { transform: translate(-50%, -50%) translateY(0); }
            100% { transform: translate(-50%, -50%) translateY(-3px); }
        }

        .progress-text {
            margin-top: 20px;
            color: #fff;
            font-size: 18px;
        }
    </style>
</head>
<body>

<!-- 背景音乐（一进页面就播放） -->
<audio id="bgMusic" loop autoplay preload="auto">
  <source src="背景音.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <img class="ghost" src="幽灵3.png" alt="幽灵">
    <h2 class="loading-title">正在为你生成幻想世界...</h2>
    <p class="prompt-text" id="promptDisplay"></p>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <img class="mini-ghost" id="miniGhost" src="幽灵4.png" alt="小幽灵">
    </div>

    <div class="progress-text" id="progressText">0%</div>
</div>

<script>
    const bgMusic = document.getElementById('bgMusic');
    bgMusic.volume = 0.3;

    const urlParams = new URLSearchParams(window.location.search);
    const prompt = urlParams.get('prompt') ? decodeURIComponent(urlParams.get('prompt')) : "你的奇妙旅程";
    document.getElementById('promptDisplay').textContent = `生成内容：${prompt}`;

    const bar = document.getElementById('progressBar');
    const miniGhost = document.getElementById('miniGhost');
    const text = document.getElementById('progressText');
    let percent = 0;

    const timer = setInterval(() => {
        percent += Math.random() * 3 + 0.5;
        
        if (percent >= 100) {
            percent = 100;
            clearInterval(timer);
            text.textContent = "生成完成！";
        } else {
            text.textContent = Math.floor(percent) + "%";
        }

        bar.style.width = percent + "%";
        miniGhost.style.left = percent + "%";

        if (percent >= 100) {
            setTimeout(() => {
                window.location.href = "mla.html";
            }, 1000);
        }
        
    }, 100);
</script>

</body>
</html>

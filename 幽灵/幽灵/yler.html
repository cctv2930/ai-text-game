<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25小时幻想空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #1a103f 0%, #3b2f75 50%, #6c53a8 100%);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 0;
            animation: twinkle 10s infinite linear;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 700px;
        }

        .ghost-box {
            position: relative;
            display: inline-block;
            margin-bottom: 0px;
            /* ✅ 这里调整幽灵整体位置，往下移动了30px */
            margin-top: 0px;
        }

        .ghost {
            width: 200px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(1 10 15px rgba(255,230,180,0.8));
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .chat-bubble {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(255, 255, 255, 0.95);
            padding: 14px 24px;
            border-radius: 25px;
            font-size: 17px;
            color: #4a3a7a;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(150, 123, 255, 0.4);
            display: none;
            animation: bubbleShow 0.6s ease forwards;
        }

        .chat-bubble::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid rgba(255, 255, 255, 0.95);
        }

        @keyframes bubbleShow {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .title {
            color: #fff;
            font-size: 26px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #8f88ff, 0 0 30px #6c53a8;
        }

        .input-box {
            width: 100%;
            height: 70px;
            padding: 0 25px;
            border-radius: 50px;
            border: 2px solid rgba(173, 153, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            font-size: 18px;
            color: white;
            outline: none;
            text-align: center;
            box-shadow: 0 0 20px rgba(144, 123, 255, 0.4), inset 0 0 15px rgba(255,255,255,0.05);
            transition: all 0.3s;
        }

        .input-box:focus {
            border-color: #a89bff;
            box-shadow: 0 0 30px rgba(168, 155, 255, 0.7);
        }

        .select-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .select-drop {
            width: 180px;
            height: 45px;
            padding: 0 15px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(144, 123, 255, 0.2);
            color: #e6e0ff;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: 0.3s;
        }

        .select-drop:hover {
            background: rgba(168, 155, 255, 0.4);
            box-shadow: 0 0 15px rgba(168, 155, 255, 0.5);
        }

        .select-drop option {
            background: #3b2f75;
            color: #fff;
        }

        .generate-btn {
            padding: 16px 50px;
            border-radius: 50px;
            background: linear-gradient(90deg, #7c6aff, #a89bff);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(124, 106, 255, 0.6);
            transition: 0.3s;
            margin-top: 10px;
        }

        .generate-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 30px rgba(124, 106, 255, 0.9);
        }
    </style>
</head>
<body>

<div class="stars"></div>

<div class="container">
    <div class="ghost-box">
        <img class="ghost" src="幽灵2jpsd.png" alt="幽灵">
        <div class="chat-bubble" id="bubble">哈喽，我是25小时幻想空间的小助手——饼饼</div>
    </div>

    <h2 class="title">DZXQH · 25小时幻想空间</h2>

    <input type="text" class="input-box" id="inputBox" placeholder="向幻想空间提问，开启你的奇妙旅程...">

    <div class="select-group">
        <select class="select-drop" id="select1">
            <option value="">主题类型</option>
            <option value="星空故事">星空故事</option>
            <option value="闯关游戏">闯关游戏</option>
            <option value="治愈梦境">治愈梦境</option>
			<option value="机械遗迹">机械遗迹</option>
			<option value="时间回溯">时间回溯</option>
			<option value="末日废土">末日废土</option>
			<option value="深海迷航">深海迷航</option>
			<option value="魔法学院">魔法学院</option>
			<option value="神话重构">神话重构</option>
			<option value="暗黑童话">暗黑童话</option>
			<option value="都市怪谈">都市怪谈</option>
			<option value="文明演化">文明演化</option>
			<option value="镜中世界">镜中世界</option>
        </select>

        <select class="select-drop" id="select2">
            <option value="">风格选择</option>
            <option value="温馨治愈">温馨治愈</option>
            <option value="奇幻冒险">奇幻冒险</option>
            <option value="浪漫梦幻">浪漫梦幻</option>
			<option value="赛博朋克">赛博朋克</option>
			<option value="水墨国风">水墨国风</option>
			<option value="暗黑哥特">暗黑哥特</option>
			<option value="极简几何">极简几何</option>
			<option value="蒸汽朋克">蒸汽朋克</option>
			<option value="北欧极简">北欧极简</option>
			<option value="玻璃彩绘">玻璃彩绘</option>
			<option value="粘土定格">粘土定格</option>
			<option value="拼贴报纸">拼贴报纸</option>
			<option value="像素水墨">像素水墨</option>
        </select>

        <select class="select-drop" id="select3">
            <option value="">时长选择</option>
            <option value="5分钟">5分钟</option>
            <option value="10分钟">10分钟</option>
            <option value="15分钟">15分钟</option>
        </select>
    </div>

    <button class="generate-btn" id="goBtn">开始生成</button>
</div>

<script>
    const input = document.getElementById('inputBox');
    const bubble = document.getElementById('bubble');
    const select1 = document.getElementById('select1');
    const select2 = document.getElementById('select2');
    const select3 = document.getElementById('select3');
    const goBtn = document.getElementById('goBtn');

    function updateInput() {
        let val1 = select1.value;
        let val2 = select2.value;
        let val3 = select3.value;
        let arr = [];
        if (val1) arr.push(val1);
        if (val2) arr.push(val2);
        if (val3) arr.push(val3);
        input.value = arr.join(' ');
    }

    select1.addEventListener('change', updateInput);
    select2.addEventListener('change', updateInput);
    select3.addEventListener('change', updateInput);

    // 保留按钮点击事件，点击直接跳转到 jiazat.html
    goBtn.addEventListener('click', function(){
        window.location.href = "jiazat.html";
    });

    window.addEventListener('load', function () {
        setTimeout(() => {
            bubble.style.display = "block";
        }, 1000);
    });
</script>

</body>
</html>
